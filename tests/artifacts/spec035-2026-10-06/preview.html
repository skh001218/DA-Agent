<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spec035 동작 검증</title><style>
body{margin:0;background:#191c23;color:#e4e7ef;font:16px system-ui}main{max-width:980px;margin:40px auto;padding:24px}h1{font-size:26px}p{color:#b9c3d8}section{background:#252b38;padding:22px;border-radius:12px;margin:16px 0}label{display:block;margin:10px 0}textarea,select{display:block;box-sizing:border-box;width:100%;background:#161c28;color:#fff;border:1px solid #60708b;border-radius:6px;padding:12px;font:inherit}button{background:#646eee;border:0;color:white;border-radius:6px;padding:11px 16px;margin:10px 6px 0 0;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}#status{font-weight:bold;color:#c2d4ff}#error{color:#ffadb7}</style>
<main><h1>Discord 텍스트 출제 흐름 검증</h1><p>임시 DB와 고정 모델 응답을 사용하는 검증용 화면입니다. 실제 Discord·모델 품질 검증과 구분합니다.</p>
<section><label for="request">연습할 내용 text</label><textarea id="request" rows="2"></textarea><label for="difficulty">난이도</label><select id="difficulty"><option value="intermediate">중급</option><option value="beginner">초급</option><option value="advanced">고급</option></select><button id="start">문제 생성</button><p id="error" role="alert"></p></section>
<section><p id="status">훈련을 시작하세요.</p><label for="input">조회 또는 보고 내용</label><textarea id="input" rows="3"></textarea><div id="actions"><button data-action="query">조회</button><button data-action="report">보고 저장</button><button data-action="followup">후속 답변</button><button data-action="submit">제출</button><button data-action="end">중단</button><button id="resume">재개</button></div></section>
<section><h2>응답과 저장 결과</h2><pre id="messages">아직 생성한 과제가 없습니다.</pre><pre id="saved"></pre></section></main>
<script>
let sid=localStorage.getItem('spec035-session');const $=id=>document.getElementById(id);
function show(value){sid=value.session_id;localStorage.setItem('spec035-session',sid);$('status').textContent='상태: '+value.state+' · 훈련 ID: '+sid;$('messages').textContent=value.messages.join('\n\n');$('saved').textContent='저장 조회: '+value.executions.length+'개 · 보고: '+value.reports.length+'개 · 평가: '+value.evaluations.length+'개\n'+value.executions.map(e=>e.result.rows.map(row=>row.join(' · ')).join('\n')).join('\n')+'\n'+(value.evaluations.at(-1)?.result.held?'평가: 점수 보류 · 피드백 보존':'');}
async function call(path,body){$('error').textContent='';const controls=[...document.querySelectorAll('button')];controls.forEach(b=>b.disabled=true);try{const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const value=await r.json();if(!r.ok)throw Error(value.error||'요청 오류');show(value);}catch(e){$('error').textContent=e.message;}finally{controls.forEach(b=>b.disabled=false);}}
$('start').onclick=()=>call('/training',{text:$('request').value,difficulty:$('difficulty').value});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>sid?call('/action',{session_id:sid,action:b.dataset.action,text:$('input').value}):$('error').textContent='먼저 문제를 생성하세요.');
$('resume').onclick=()=>sid&&call('/session/'+encodeURIComponent(sid));if(sid)call('/session/'+encodeURIComponent(sid));
</script></html>
